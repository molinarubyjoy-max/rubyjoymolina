
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 35px auto;
            padding: 20px;
            background: #f2f5fa;
            color: #222;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        h2 {
            color: #245a91;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px 3px 5px 0;
            background: #245a91;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #17365d;
        }

        input {
            padding: 10px;
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            background: #eef4fa;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }

        .result:empty {
            display: none;
        }

        .student-card {
            background: white;
            border: 1px solid #d5dfeb;
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
        }

        .student-card p {
            margin: 6px 0;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- Original Student Information -->
    <div class="section">
        <h2>Student Information</h2>

        <button onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="studentResult" class="result"></div>
    </div>


    <!-- Original Greeting API -->
    <div class="section">
        <h2>Greeting API</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your first name"
        >

        <button onclick="sayHello()">Say Hello</button>

        <p id="greeting"></p>
    </div>


    <!-- Original Campus API -->
    <div class="section">
        <h2>Campus Information</h2>

        <button onclick="loadCampus()">
            Load Campus Information
        </button>

        <div id="campusResult" class="result"></div>
    </div>


    <!-- Original Grade Calculator -->
    <div class="section">
        <h2>Grade Calculator</h2>

        <input
            type="number"
            id="scoreInput"
            placeholder="Enter score (0-100)"
            min="0"
            max="100"
            step="any"
        >

        <button onclick="calculateGrade()">
            Calculate Grade
        </button>

        <div id="gradeResult" class="result"></div>
    </div>


    <!-- Activity 7: All Students from Database -->
    <div class="section">
        <h2>Students from Database</h2>

        <p>Display all student records stored in SQLite.</p>

        <button onclick="loadStudents()">Load Students</button>

        <div id="studentList" class="result"></div>
    </div>


    <!-- Activity 7 Additional Task: Filter by Program -->
    <div class="section">
        <h2>Search Students by Program</h2>

        <p>Enter a program to find matching database records.</p>

        <input
            type="text"
            id="programInput"
            placeholder="Example: BSIT"
        >

        <button onclick="loadStudentsByProgram()">
            Search Program
        </button>

        <div id="programResult" class="result"></div>
    </div>


    <footer>
        Laboratory Activities 6 and 7 - Flask API
    </footer>


    <script>

        // Display one sample student from the original API
        function loadStudent() {
            fetch('/student')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    const result =
                        document.getElementById('studentResult');

                    result.replaceChildren();

                    Object.entries({
                        'Student ID': data.student_id,
                        'Name': data.name,
                        'Program': data.program,
                        'Year': data.year,
                        'Section': data.section
                    }).forEach(([label, value]) => {
                        const p = document.createElement('p');
                        const b = document.createElement('b');

                        b.textContent = label + ': ';
                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(value)
                        );

                        result.appendChild(p);
                    });
                })
                .catch(() => {
                    document.getElementById('studentResult')
                        .textContent =
                        'Unable to retrieve student information.';
                });
        }


        // Greeting API
        function sayHello() {
            const name =
                document.getElementById('nameInput').value.trim();

            const greeting =
                document.getElementById('greeting');

            if (!name) {
                greeting.textContent =
                    'Please enter your first name.';
                return;
            }

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    greeting.textContent = data.message;
                })
                .catch(() => {
                    greeting.textContent =
                        'Unable to retrieve greeting.';
                });
        }


        // Campus Information API
        function loadCampus() {
            fetch('/campus')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    const result =
                        document.getElementById('campusResult');

                    result.replaceChildren();

                    Object.entries(data).forEach(([label, value]) => {
                        const p = document.createElement('p');
                        const b = document.createElement('b');

                        b.textContent =
                            label.charAt(0).toUpperCase() +
                            label.slice(1) + ': ';

                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(value)
                        );

                        result.appendChild(p);
                    });
                })
                .catch(() => {
                    document.getElementById('campusResult')
                        .textContent =
                        'Unable to retrieve campus information.';
                });
        }


        // Grade Calculator API
        function calculateGrade() {
            const score =
                document.getElementById('scoreInput').value;

            const result =
                document.getElementById('gradeResult');

            if (score.trim() === '') {
                result.textContent = 'Please enter a score.';
                return;
            }

            fetch('/grade?score=' + encodeURIComponent(score))
                .then(async response => {
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error || 'Unable to calculate grade.'
                        );
                    }

                    return data;
                })
                .then(data => {
                    result.textContent =
                        'Score: ' + data.score +
                        ' | Remark: ' + data.remark;
                })
                .catch(error => {
                    result.textContent = error.message;
                });
        }


        // Activity 7: Load all students from SQLite
        function loadStudents() {
            const list = document.getElementById('studentList');

            list.textContent = 'Loading student records...';

            fetch('/students')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    list.replaceChildren();

                    if (data.length === 0) {
                        list.textContent =
                            'No student records found.';
                        return;
                    }

                    data.forEach(student => {
                        const card =
                            document.createElement('div');

                        card.className = 'student-card';

                        const fields = [
                            ['Database ID', student.id],
                            ['Student ID', student.student_id],
                            ['Name', student.name],
                            ['Program', student.program],
                            ['Year', student.year],
                            ['Section', student.section]
                        ];

                        fields.forEach(([label, value]) => {
                            const p = document.createElement('p');
                            const b = document.createElement('b');

                            b.textContent = label + ': ';
                            p.appendChild(b);
                            p.appendChild(
                                document.createTextNode(value)
                            );

                            card.appendChild(p);
                        });

                        list.appendChild(card);
                    });
                })
                .catch(() => {
                    list.textContent =
                        'Unable to retrieve student records.';
                });
        }


        // Additional Task: Search students by program
        function loadStudentsByProgram() {
            const program =
                document.getElementById('programInput')
                    .value.trim();

            const result =
                document.getElementById('programResult');

            if (!program) {
                result.textContent =
                    'Please enter a program, such as BSIT.';
                return;
            }

            result.textContent = 'Searching database...';

            fetch(
                '/students/program/' +
                encodeURIComponent(program)
            )
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    result.replaceChildren();

                    if (data.length === 0) {
                        result.textContent =
                            'No students found for this program.';
                        return;
                    }

                    data.forEach(student => {
                        const p = document.createElement('p');

                        p.textContent =
                            student.student_id + ' - ' +
                            student.name + ' | ' +
                            student.program + ' | Year ' +
                            student.year + ' | Section ' +
                            student.section;

                        result.appendChild(p);
                    });
                })
                .catch(() => {
                    result.textContent =
                        'Unable to retrieve program records.';
                });
        }

    </script>

</body>
</html>
