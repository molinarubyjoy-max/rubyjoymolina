
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f2f5fa;
            color: #222;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        h2 {
            color: #245a91;
            margin-top: 0;
        }

        .section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            padding: 10px 15px;
            margin-top: 8px;
            background-color: #245a91;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #17365d;
        }

        input {
            padding: 10px;
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #eef4fa;
            border-radius: 5px;
            overflow-wrap: anywhere;
        }

        .result:empty {
            display: none;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- Student Information -->
    <div class="section">
        <h2>Student Information</h2>

        <button onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="studentResult" class="result"></div>
    </div>

    <!-- Greeting API -->
    <div class="section">
        <h2>Greeting API</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your first name"
        >

        <button onclick="sayHello()">Say Hello</button>

        <p id="greeting"></p>
    </div>

    <!-- Campus Information API -->
    <div class="section">
        <h2>Campus Information</h2>

        <p>Click below to display campus information.</p>

        <button onclick="loadCampus()">
            Load Campus Information
        </button>

        <div id="campusResult" class="result"></div>
    </div>

    <!-- Grade Calculator API -->
    <div class="section">
        <h2>Grade Calculator</h2>

        <p>Enter your score from 0 to 100.</p>

        <input
            type="number"
            id="scoreInput"
            placeholder="Enter score"
            min="0"
            max="100"
            step="any"
        >

        <button onclick="calculateGrade()">
            Calculate Grade
        </button>

        <div id="gradeResult" class="result"></div>
    </div>

    <footer>
        Laboratory Activity 6 - Flask API Web Interface
    </footer>

    <script>

        // Load Student Information
        function loadStudent() {
            fetch('/student')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }

                    return response.json();
                })
                .then(data => {
                    const result =
                        document.getElementById('studentResult');

                    result.replaceChildren();

                    const fields = [
                        ['Student ID', data.student_id],
                        ['Name', data.name],
                        ['Program', data.program],
                        ['Year', data.year],
                        ['Section', data.section]
                    ];

                    fields.forEach(([label, value]) => {
                        const p = document.createElement('p');
                        const b = document.createElement('b');

                        b.textContent = label + ': ';

                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(value)
                        );

                        result.appendChild(p);
                    });
                })
                .catch(() => {
                    document.getElementById('studentResult')
                        .textContent =
                        'Unable to retrieve student information.';
                });
        }


        // Greeting API
        function sayHello() {
            const name =
                document.getElementById('nameInput').value.trim();

            const greeting =
                document.getElementById('greeting');

            if (name === '') {
                greeting.textContent =
                    'Please enter your first name.';
                return;
            }

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }

                    return response.json();
                })
                .then(data => {
                    greeting.textContent = data.message;
                })
                .catch(() => {
                    greeting.textContent =
                        'Unable to retrieve greeting.';
                });
        }


        // Campus Information API
        function loadCampus() {
            fetch('/campus')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }

                    return response.json();
                })
                .then(data => {
                    const result =
                        document.getElementById('campusResult');

                    result.replaceChildren();

                    const fields = [
                        ['Campus', data.campus],
                        ['Location', data.location],
                        ['Type', data.type],
                        ['Status', data.status]
                    ];

                    fields.forEach(([label, value]) => {
                        const p = document.createElement('p');
                        const b = document.createElement('b');

                        b.textContent = label + ': ';

                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(value)
                        );

                        result.appendChild(p);
                    });
                })
                .catch(() => {
                    document.getElementById('campusResult')
                        .textContent =
                        'Unable to retrieve campus information.';
                });
        }


        // Grade Calculator API
        function calculateGrade() {
            const score =
                document.getElementById('scoreInput').value;

            const result =
                document.getElementById('gradeResult');

            if (score.trim() === '') {
                result.textContent = 'Please enter a score.';
                return;
            }

            fetch('/grade?score=' + encodeURIComponent(score))
                .then(async response => {
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error || 'Unable to calculate grade.'
                        );
                    }

                    return data;
                })
                .then(data => {
                    result.textContent =
                        'Score: ' + data.score +
                        ' | Remark: ' + data.remark;
                })
                .catch(error => {
                    result.textContent = error.message;
                });
        }

    </script>

</body>
</html>
